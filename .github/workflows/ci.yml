name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
 build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + Integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://nexora:test@localhost:5432/nexora_test
          JWT_SECRET: ci-test-secret-00000000000000000000000000000000
          JWT_REFRESH_SECRET: ci-test-refresh-secret-000000000000000000000000
          NODE_ENV: test

      - name: Build API
        run: pnpm --filter @nexora/api build
        env:
          DATABASE_URL: postgres://nexora:test@localhost:5432/nexora_test
          JWT_SECRET: ci-test-secret-00000000000000000000000000000000
          JWT_REFRESH_SECRET: ci-test-refresh-secret-000000000000000000000000
          NODE_ENV: test

      - name: Build Web
        run: pnpm --filter @nexora/web build
