# ============================================================
# NEXORA SMART EDU V1 — Development Environment
# Usage: docker compose -f infrastructure/docker/docker-compose.dev.yml up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: Nexora@2024!
      POSTGRES_DB: nexora
    ports:
      - "5433:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexora_pgdata:
