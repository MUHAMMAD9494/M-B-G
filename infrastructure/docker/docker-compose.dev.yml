version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-db
    environment:
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: nexora_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
